function localDay(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const dateObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dayNumber(){const d=new Date(),s=dateObj(START);return Math.max(0,Math.min(TOTAL_DAYS,Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(s.getFullYear(),s.getMonth(),s.getDate()))/86400000)+1))}
function prettyDate(s){return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(dateObj(s))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Stockage indisponible : exporte tes données pour les préserver.')}}

const $=selector=>document.querySelector(selector);
function pageHeader(eyebrow,title,subtitle,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1><p class="subheading">${esc(subtitle)}</p></div>${actions?`<div class="page-head-actions">${actions}</div>`:''}</div>`}
function progress(done,total){return `<div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,total?done/total*100:0))}%"></div></div>`}
function habitStat(d){let data=state.habits[d]||{};return habitDefs.filter(h=>!!data[h.id]).length}
function habitMarkup(d){const done=state.habits[d]||{};return `<div class="habit-list">${habitDefs.map(h=>`<div class="habit-row"><label><input type="checkbox" data-habit="${h.id}" ${done[h.id]?'checked':''} aria-label="${esc(h.name)}"><span>${esc(h.name)}</span></label><small>${esc(h.detail)}</small></div>`).join('')}</div>`}
function currentChallenge(){const today=new Date();let monthIndex=(today.getFullYear()-2026)*12+today.getMonth()-10;return challenges[Math.max(0,Math.min(35,monthIndex))]}
function challengeDone(){return challenges.filter(c=>(state.challenges[c.id]||'')==='Réalisé').length}
function ratingAverage(){return (pillars.reduce((a,p)=>a+Number(state.scores?.[p.id]??5),0)/pillars.length).toFixed(1).replace('.',',')}

function noteList(){let q=ui.notesQuery.toLocaleLowerCase('fr').trim();let filtered=state.notes.filter(n=>(ui.notesCategory==='Toutes'||n.category===ui.notesCategory)&&(!q||`${n.title} ${n.body} ${n.tags} ${n.category}`.toLocaleLowerCase('fr').includes(q))).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||String(b.updatedAt).localeCompare(String(a.updatedAt)));return filtered.length?`<div class="notes-grid">${filtered.map(n=>`<article class="card note-card" tabindex="0" role="button" data-note="${esc(n.id)}"><div class="note-card-footer"><span class="pill muted">${esc(n.category)}</span>${n.pinned?'<span>📌</span>':''}</div><h3>${esc(n.title)}</h3><p>${esc(n.body||'Note vide')}</p><div class="note-card-footer"><small>${new Date(n.updatedAt).toLocaleDateString('fr-FR')}</small><div class="note-tags">${String(n.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">▤</div><h3>Aucune note trouvée</h3><p>Ajoute une note ou modifie tes filtres.</p><button class="primary" data-action="addnote">＋ Créer une note</button></div>`}

function challengePage(){let filtered=challenges.filter(c=>ui.challengeYear===0||c.year===ui.challengeYear);return pageHeader('36 EXPÉRIENCES · 3 ANS','Mes défis mensuels','Un défi d’aventure par mois, avec une difficulté progressivement croissante.',`<span class="pill">${challengeDone()} / 36 réalisés</span>`)+`<div class="section-top"><div class="chips">${[['Tout',0],['Année 1',1],['Année 2',2],['Année 3',3]].map(([label,id])=>`<button class="chip ${ui.challengeYear===id?'active':''}" data-year="${id}">${label}</button>`).join('')}</div></div><div class="grid-challenges">${filtered.map(c=>{const status=state.challenges[c.id]||'À planifier';return `<article class="challenge-card ${status==='Réalisé'?'completed':''}"><div class="challenge-card-top"><span class="pill muted">${esc(c.month)}</span><span class="challenge-icon">${c.icon}</span></div><h3>${esc(c.title)}</h3><div class="challenge-meta">${esc(c.distance)} · ${esc(c.level)}</div><div class="challenge-detail">${esc(c.prep)}</div><div class="prep"><label>Statut du défi<select data-challenge="${c.id}" aria-label="Statut ${esc(c.title)}">${['À planifier','Planifié','Réalisé','Reporté','Annulé'].map(s=>`<option ${status===s?'selected':''}>${s}</option>`).join('')}</select></label></div></article>`}).join('')}</div><p class="footnote">Les défis techniques et en milieu naturel nécessitent une préparation et un encadrement adaptés. Le marathon du 19 septembre 2027 reste prioritaire pendant l’année 1.</p>`}
function sportPage(){return pageHeader('ENTRAÎNEMENT · 7 JOURS','Mon programme sportif','Muscle-up, handstand push-up, bent-arm press, football, sprint et marathon.')+`<div class="hero" style="min-height:118px"><div><span class="eyebrow">MON OBJECTIF DE L’ANNÉE 1</span><h2>Muscle-up · HSPU · Marathon</h2><p>Marathon fixé au dimanche 19 septembre 2027.</p></div><div class="hero-stamp"><strong>42,2</strong><span>KILOMÈTRES</span></div></div><div class="schedule-list">${training.map(t=>`<article class="card sport-card"><div class="day-box">${t.day}</div><div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><ul>${t.exercises.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></article>`).join('')}</div><div class="card" style="margin-top:17px"><h2 class="section-title">Progression technique du handstand push-up</h2><p class="subheading">Pike push-up → pike pieds surélevés → négatives contrôlées au mur → amplitude réduite au mur → handstand push-up strict au mur. Avance seulement après maîtrise de l’étape précédente.</p></div>`}
function goalPage(){return pageHeader('VISION · 2026—2029','Mes six piliers','Auto-évalue ton niveau régulièrement et relie chaque pilier à une action concrète.')+`<div class="goal-grid bottom-gap">${pillars.map(p=>{let n=Math.max(1,Math.min(10,Number(state.scores?.[p.id]??5)));return `<article class="card goal-card"><div class="goal-top"><div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p></div><span class="goal-icon">${p.icon}</span></div><div class="score-control"><input type="range" min="1" max="10" value="${n}" data-score="${p.id}" aria-label="Auto-évaluation ${esc(p.name)}"><span class="score-num" data-score-read="${p.id}">${n}/10</span></div><div class="score-line"><span>Évaluation actuelle</span><span>Objectif indicatif : 7/10</span></div></article>`}).join('')}</div><div class="section-top"><h2 class="section-title">Trois étapes, un même cap</h2></div><div class="milestones">${yearly.map(y=>`<article class="milestone"><b>${esc(y.title)}</b><p>${esc(y.date)}</p><ul>${y.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</div><div class="card" style="margin-top:18px"><div class="section-top"><h2 class="section-title">Connaissances & carrière</h2><span class="pill info">2 DOMAINES PRIORITAIRES</span></div><div class="two-col"><div><b>🏠 Rénovation énergétique</b><p class="subheading">PAC, isolation, ventilation, audits, CEE, dimensionnement, réglementation et veille technique.</p><button class="ghost" data-go="notes" data-category="Rénovation énergétique" style="margin-top:10px">Mes notes énergie →</button></div><div><b>💼 Direction générale</b><p class="subheading">Vision, stratégie, management, recrutements, prospection, finances, délégation et pilotage.</p><button class="ghost" data-go="notes" data-category="Leadership / DG" style="margin-top:10px">Mes notes de DG →</button></div></div></div>`}
function settingsPage(){return pageHeader('MES DONNÉES','Sauvegarde & paramètres','Les notes sont stockées sur ton appareil. Tu gardes la main sur leur exportation et leur suppression.')+`<div class="card settings-panel"><div class="settings-item"><div><b>Exporter toutes mes données</b><p>Notes, habitudes, journal, défis et évaluations dans un fichier JSON. À conserver en lieu sûr.</p></div><div class="buttons"><button class="primary" data-action="export">↓ Exporter</button></div></div><div class="settings-item"><div><b>Importer une sauvegarde</b><p>Utile pour passer de ton ordinateur à ton téléphone ou restaurer une sauvegarde.</p></div><div class="buttons"><button class="ghost" data-action="import">↑ Importer</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="settings-item"><div><b>Confidentialité et synchronisation</b><p>Aucun compte ni serveur. Les données restent dans le navigateur utilisé. La synchronisation téléphone ↔ ordinateur n'est pas automatique dans cette version : exporte puis importe le JSON.</p></div><span class="pill info">LOCAL</span></div><div class="settings-item"><div><b>Installation sur téléphone</b><p>Pour l’installer sur l’écran d’accueil, mets le dossier sur un hébergement HTTPS et utilise « Ajouter à l’écran d’accueil ». L’application fonctionne aussi en ouvrant index.html sur ordinateur.</p></div><span class="pill muted">PWA</span></div><div class="settings-item"><div><b>Réinitialiser l’application</b><p>Efface toutes les données de cet appareil. Exporte une sauvegarde avant, si nécessaire.</p></div><button class="ghost danger" data-action="reset">Tout effacer</button></div></div>`}
const pages={dashboard,notes:notesPage,habits:habitsPage,challenges:challengePage,sport:sportPage,goals:goalPage,settings:settingsPage};
const pageNames={dashboard:'Tableau de bord',notes:'Mes notes',habits:'Habitudes',challenges:'36 défis',sport:'Sport & entraînement',goals:'Mes objectifs',settings:'Paramètres'};
function render(){const name=pages[ui.page]?ui.page:'dashboard';$('#content').innerHTML=pages[name]();$('#pageCrumb').textContent=pageNames[name];document.querySelectorAll('[data-page]').forEach(e=>{e.classList.toggle('active',e.dataset.page===name)});$('#sidebar').classList.remove('open')}
function navigate(page,category){ui.page=page;if(category){ui.notesCategory=category;ui.notesQuery=''}render();window.scrollTo({top:0,behavior:'instant'})}
function openNote(id){const n=id?state.notes.find(n=>n.id===id):null;$('#noteId').value=n?.id||'';$('#noteTitle').value=n?.title||'';$('#noteBody').value=n?.body||'';$('#noteTags').value=n?.tags||'';$('#notePinned').checked=!!n?.pinned;$('#noteCategory').innerHTML=categories.map(c=>`<option ${n?.category===c?'selected':''}>${esc(c)}</option>`).join('');$('#modalTitle').textContent=n?'Modifier une note':'Nouvelle note';let old=$('#deleteNote');if(old)old.remove();if(n){const b=document.createElement('button');b.id='deleteNote';b.type='button';b.className='ghost danger';b.textContent='Supprimer';b.addEventListener('click',()=>{if(confirm('Supprimer définitivement cette note ?')){state.notes=state.notes.filter(note=>note.id!==n.id);persist();closeNote();render();toast('Note supprimée')}});$('.modal-actions').prepend(b)}$('#modalBackdrop').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('#noteTitle').focus(),30)}
function closeNote(){$('#modalBackdrop').hidden=true;document.body.style.overflow=''}
$('#noteForm').addEventListener('submit',ev=>{ev.preventDefault();let id=$('#noteId').value,title=$('#noteTitle').value.trim(),body=$('#noteBody').value,category=$('#noteCategory').value,tags=$('#noteTags').value.trim(),pinned=$('#notePinned').checked;if(!title)return;let existing=state.notes.find(n=>n.id===id);if(existing)Object.assign(existing,{title,body,category,tags,pinned,updatedAt:new Date().toISOString()});else state.notes.unshift({id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,body,category,tags,pinned,updatedAt:new Date().toISOString()});persist();closeNote();render();toast('Note enregistrée')});
$('#closeModal').onclick=closeNote;$('#cancelNote').onclick=closeNote;$('#modalBackdrop').addEventListener('click',ev=>{if(ev.target===$('#modalBackdrop'))closeNote()});$('#quickAdd').onclick=()=>openNote();$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#searchOpen').onclick=()=>{navigate('notes');setTimeout(()=>$('#notesSearch')?.focus(),50)};
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();navigate('notes');setTimeout(()=>$('#notesSearch')?.focus(),30)}if(ev.key==='Escape'&&!$('#modalBackdrop').hidden)closeNote()});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('#content').addEventListener('click',ev=>{const note=ev.target.closest('[data-note]');if(note){openNote(note.dataset.note);return}const go=ev.target.closest('[data-go]');if(go){navigate(go.dataset.go,go.dataset.category);return}const year=ev.target.closest('[data-year]');if(year){ui.challengeYear=Number(year.dataset.year);render();return}const action=ev.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case 'addnote':openNote();break;case 'save-reflection':state.reflections[ui.habitDate]=$('#reflectionText').value;persist();toast('Bilan enregistré');break;case 'export':exportData();break;case 'import':$('#importFile').click();break;case 'reset':if(confirm('Effacer toutes les notes, habitudes et progrès sur cet appareil ?')){if(confirm('Dernière confirmation : cette action est irréversible sans sauvegarde.')){state=init();persist();render();toast('Données réinitialisées')}}break}});
$('#content').addEventListener('change',ev=>{const e=ev.target;if(e.matches('[data-habit]')){const d=ui.page==='habits'?ui.habitDate:localDay()<START?START:(localDay()>END?END:localDay());state.habits[d]??={};state.habits[d][e.dataset.habit]=e.checked;persist();render();toast(e.checked?'Habitude validée':'Habitude décochée')}else if(e.matches('[data-challenge]')){state.challenges[e.dataset.challenge]=e.value;persist();render();toast('Défi mis à jour')}else if(e.id==='notesCategoryFilter'){ui.notesCategory=e.value;$('#notesList').innerHTML=noteList()}else if(e.id==='habitDatePicker'){ui.habitDate=e.value;render()}else if(e.matches('[data-score]')){state.scores[e.dataset.score]=Math.max(1,Math.min(10,Number(e.value)));persist();toast('Auto-évaluation enregistrée')}});
$('#content').addEventListener('input',ev=>{const e=ev.target;if(e.id==='notesSearch'){ui.notesQuery=e.value;$('#notesList').innerHTML=noteList()}else if(e.matches('[data-score]')){$(`[data-score-read="${e.dataset.score}"]`).textContent=e.value+'/10'}});
$('#content').addEventListener('keydown',ev=>{const note=ev.target.closest('[data-note]');if(note&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();openNote(note.dataset.note)}});
function exportData(){const data=JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Humain Ultime'},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Humain_Ultime_Sauvegarde_${localDay()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde exportée')}
$('#content').addEventListener('change',async ev=>{const e=ev.target;if(e.id!=='importFile')return;const file=e.files?.[0];if(!file)return;if(file.size>5*1024*1024){toast('Fichier trop volumineux (maximum 5 Mo)');return}try{const raw=JSON.parse(await file.text());if(!raw||!Array.isArray(raw.notes)||typeof raw.habits!=='object'||typeof raw.challenges!=='object')throw Error('Format de sauvegarde incorrect');if(confirm('Remplacer les données de cet appareil par la sauvegarde ?')){state={...init(),...raw};persist();render();toast('Sauvegarde importée avec succès')}}catch(e){toast('Sauvegarde invalide : '+e.message)}});

render();
})();

</script>
</body>
</html>
